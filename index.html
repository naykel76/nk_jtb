<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <title>Home</title>
</head>

<body>

    <!-- this works fine and the sidebar is properly positioned -->
    <header class="bg-white shadow-sm">
        <div class="container flex va-c justify-between py">
            <!-- Mobile Sidebar (with self-contained toggle button) -->
            <div x-data="{ open: false }" @keydown.escape.window="open = false">

                <button x-on:click="open = !open" class="wh-2 txt-slate-700 hover:txt-slate-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>


                <div class="light absolute top-0 left-0 h-full transition-all z-highest w-16 translate-x-0 opacity-1" :class="{ '-translate-x-full opacity-0': open === false, 'translate-x-0 opacity-1': open === true }">

                </div>
            </div>

        </div>
    </header>

    <!-- Same glass navbar. The panel is teleported to body so it escapes the
         backdrop-filter ancestor, while staying in the same x-data as the burger. -->
    <section class="relative tac">
        <div class="glass absolute top-5 left-0 w-full z-above">
            <div class="flex va-c justify-between container py-075">

                <div x-data="{ open: false }" x-on:keydown.escape.window="open = false">

                    <button x-on:click="open = !open" :aria-expanded="open" class="wh-2 txt-slate-700 hover:txt-slate-500">
                        <svg x-show="!open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                        <svg x-cloak x-show="open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>

                    <template x-teleport="body">
                        <div>
                            <div x-cloak x-show="open" x-transition.opacity x-on:click="open = false" class="overlay"></div>

                            <aside x-cloak class="light fixed top-0 left-0 h-screen w-16 flex-col z-highest transition-all"
                                :class="{ '-translate-x-full': !open, 'translate-x-0': open }">

                                <header class="flex justify-between va-c pxy-075 bdr-b">
                                    <span class="txt-muted">Menu</span>
                                    <button type="button" class="btn light sm" x-on:click="open = false">Close</button>
                                </header>

                                <div class="flex-1 overflow-y-auto pxy-075">
                                    <ul class="menu">
                                        <li><a href="#">Dashboard</a></li>
                                        <li><a href="#">Courses</a></li>
                                        <li><a href="#">Lessons</a></li>
                                        <li><a href="#">Students</a></li>
                                        <li><a href="#">Settings</a></li>
                                    </ul>
                                </div>

                                <footer class="pxy-075 bdr-t txt-muted">Signed in as Nathan</footer>

                            </aside>
                        </div>
                    </template>

                </div>
            </div>
        </div>
    </section>





    <script type="module" src="/main.js"></script>
</body>

</html>
