<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <title>Home</title>
</head>

<body>

    <header class="sticky top-0 z-high light pxy-075">Sticky header (sticky top-0 z-high)</header>

    <div x-data="{ open: false }" x-on:keydown.escape.window="open = false">

        <div class="pxy-075">
            <button type="button" class="btn" x-on:click="open = true">Menu</button>
        </div>

        <div x-cloak x-show="open" x-on:click="open = false" class="overlay"></div>

        <aside class="fixed top-0 left-0 h-screen w-16 flex-col light z-highest transition"
            :class="open ? 'translate-x-0' : '-translate-x-full'">

            <header class="flex justify-between va-c pxy-075 bdr-b">
                <span class="txt-muted">Menu</span>
                <button type="button" class="btn light sm" x-on:click="open = false">Close</button>
            </header>

            <div class="flex-1 overflow-y-auto pxy-075">
                <ul class="menu">
                    <li><a href="#" class="active">Dashboard</a></li>
                    <li><a href="#">Courses</a></li>
                    <li><a href="#">Lessons</a></li>
                    <li><a href="#">Students</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </div>

            <footer class="pxy-075 bdr-t txt-muted">Signed in as Nathan</footer>

        </aside>

    </div>

    <div class="grid cols-3">

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 480 270">
            <g clip-path="url(#card-1-16-9__a)">
                <path fill="#fff" d="M0 0h480v270H0z" />
                <path fill="#969FA7" d="M462.375 18H316.5v3.75h145.875z" />
                <path fill="#903163" d="M312.75 18H166.875v3.75H312.75z" />
                <path fill="#4D1434" d="M163.5 18H17.625v3.75H163.5z" />
                <path fill="#903163" fill-rule="evenodd" d="M407.438 24.375c18.329 0 33.187-14.943 33.187-33.375H374.25c0 18.432 14.858 33.375 33.188 33.375" />
                <path fill="#F6DEEC" fill-rule="evenodd" d="M484.5 147c0 42.457-34.504 76.875-77.062 76.875-42.561 0-77.063-34.418-77.063-76.875s34.502-76.875 77.063-76.875c42.558 0 77.062 34.418 77.062 76.875" />
            </g>
            <defs>
                <clipPath id="card-1-16-9__a">
                    <path fill="#fff" d="M0 0h480v270H0z" />
                </clipPath>
            </defs>
        </svg>

    </div>

    <script type="module" src="/main.js"></script>
</body>

</html>
